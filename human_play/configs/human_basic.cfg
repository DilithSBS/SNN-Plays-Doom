# Configuration for Interactive Human Play: Combat Arena (Basic)
# High resolution, full color, HUD, crosshair, and all movement/combat buttons enabled.

doom_scenario_path = ../../configs/basic.wad
doom_map = map01

# Rewards
living_reward = -1

# Rendering options
screen_resolution = RES_800X600
screen_format = RGB24
render_hud = true
render_crosshair = true
render_weapon = true
render_decals = true
render_particles = true
window_visible = true

# Episode timeout (10,500 ticks = ~5 minutes, plenty of time for human play)
episode_timeout = 10500
episode_start_time = 1

# Available buttons for human controls
available_buttons = 
	{ 
		MOVE_LEFT 
		MOVE_RIGHT 
		ATTACK 
		MOVE_FORWARD 
		MOVE_BACKWARD 
		TURN_LEFT 
		TURN_RIGHT 
		USE 
		SPEED 
		STRAFE 
	}

# Game variables to track
available_game_variables = 
	{ 
		KILLCOUNT
		ITEMCOUNT
		SECRETCOUNT
		FRAGCOUNT
		DEATHCOUNT
		HEALTH
		ARMOR
		DEAD
		ON_GROUND
		ATTACK_READY
		ALTATTACK_READY
		SELECTED_WEAPON
		SELECTED_WEAPON_AMMO
		AMMO2
	}

mode = ASYNC_SPECTATOR
