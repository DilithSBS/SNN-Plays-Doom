		TURN_RIGHT 
		ATTACK 
		MOVE_LEFT 
		MOVE_RIGHT 
		MOVE_FORWARD 
		MOVE_BACKWARD 
		SPEED 
	}

available_game_variables = 
	{ 
		KILLCOUNT
		HEALTH
		ARMOR
		AMMO2
	}

mode = ASYNC_SPECTATOR
