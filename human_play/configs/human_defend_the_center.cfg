# Configuration for Interactive Human Play: 360° Circular Arena Defense
# Stand in the center of the arena, rotate 360°, and eliminate incoming waves of monsters!

doom_scenario_path = defend_the_center.wad
doom_map = map01

# Rewards
living_reward = 0

# Rendering options
screen_resolution = RES_800X600
screen_format = RGB24
render_hud = true
render_crosshair = true
render_weapon = true
