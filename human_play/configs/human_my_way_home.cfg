# Configuration for Interactive Human Play: 3D Labyrinth Traversal (my_way_home)
# Find your way through the maze corridors to retrieve the green armor vest.

doom_scenario_path = ../../configs/my_way_home.wad
doom_map = map01

# Rewards
living_reward = -0.0005

# Rendering options
screen_resolution = RES_800X600
screen_format = RGB24
render_hud = true
render_crosshair = true
render_weapon = true
render_decals = true
render_particles = true
window_visible = true

# Episode timeout (21,000 ticks = ~10 minutes)
episode_timeout = 21000
episode_start_time = 1

# Available buttons for human controls
available_buttons = 
	{ 
		TURN_LEFT 
		TURN_RIGHT 
		MOVE_FORWARD 
		MOVE_BACKWARD
		MOVE_LEFT 
		MOVE_RIGHT 
		USE
		SPEED
		STRAFE
	}

# Game variables to track
available_game_variables = 
	{ 
		HEALTH
		ARMOR
		POSITION_X
		POSITION_Y
		POSITION_Z
		ANGLE
	}

mode = ASYNC_SPECTATOR
